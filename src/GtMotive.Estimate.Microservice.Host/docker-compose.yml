services:
  estimate-microservice:
    build:
      context: ../..
      dockerfile: src/GtMotive.Estimate.Microservice.Host/Dockerfile
    ports:
      - "8080:80"  
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80  
      - MongoDb__ConnectionString=mongodb://mongodb:27017
      - MongoDb__MongoDbDatabaseName=estimate-db
    depends_on:
      - mongodb
    networks:
      - estimate-network

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017" 
    environment:
      - MONGO_INITDB_DATABASE=estimate-db
    volumes:
      - mongodb_data:/data/db
    networks:
      - estimate-network

  mongo-express:
    image: mongo-express:1.0
    ports:
      - "8081:8081"  
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=password
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - mongodb
    networks:
      - estimate-network

volumes:
  mongodb_data:
    driver: local

networks:
  estimate-network:
    driver: bridge